{% for row in rows %}<article data-doc-item="{{ row.id }}" class="shared-file{% if row.folder != None %} is-folder{% endif %}">
{% if row.folder != None %}<a class="shared-file-main shared-folder-link" data-doc-nav href="{% url 'shared_documents' %}?drive={{ drive|urlencode }}&amp;folder={{ row.id|urlencode }}{% if parent %}&amp;kind={{ kind }}&amp;parent={{ parent.pk }}{% endif %}"><span class="shared-file-icon" aria-hidden="true">📁</span><span><strong>{{ row.name }}</strong><small>폴더</small></span></a>{% else %}<a class="shared-file-main shared-folder-link" href="{% url 'shared_document_open' drive row.id %}" target="_blank" rel="noopener noreferrer"><span class="shared-file-icon" aria-hidden="true">▤</span><span><strong>{{ row.name }}</strong><small>{{ row.size|filesizeformat }}</small></span></a>{% endif %}
<div class="shared-actions">{% if row.folder == None %}<a class="button" href="{% url 'shared_document_link' drive row.id %}{% if parent %}?kind={{ kind }}&amp;{{ kind }}={{ parent.pk }}{% endif %}">업무에 연결</a>{% endif %}
<details class="shared-item-menu"><summary aria-label="{{ row.name }} 메뉴">⋯</summary><div><a href="{% url 'shared_document_access' drive row.id %}">접근 권한 확인</a>{% if row.folder != None and can_manage_folders %}<a href="{% url 'shared_folder_manage' drive %}?action=rename&amp;folder={{ row.id|urlencode }}">이름 변경</a><a class="shared-danger" href="{% url 'shared_folder_manage' drive %}?action=delete&amp;folder={{ row.id|urlencode }}">폴더 삭제</a>{% endif %}</div></details></div>
</article>{% endfor %}
