<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f4f6f8;color:#20332d;font-family:Malgun Gothic,Arial,sans-serif">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:28px 16px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:620px;background:#fff;border:1px solid #e0e7e3;border-radius:14px;overflow:hidden">
<tr><td style="padding:24px;border-top:5px solid #246b51;border-bottom:1px solid #e9eeeb">
<strong style="font-size:21px;line-height:1.5;letter-spacing:0.3px;color:#205b47">GUNSYSTEMS</strong>
<div style="margin-top:5px;font-size:13px;line-height:1.6;color:#708078">Workhub · 설문조사</div>
</td></tr>
<tr><td style="padding:28px 24px 32px">
<h1 style="margin:0 0 24px;font-size:23px;line-height:1.6;font-weight:700;color:#172f26;word-break:keep-all;overflow-wrap:anywhere">{{ title }}</h1>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f7f4;border:1px solid #e1e9e5;border-radius:10px">
<tr><td style="padding:18px 20px 6px;font-size:13px;line-height:1.6;color:#61736a">응답 마감 · 한국 시간</td></tr>
<tr><td style="padding:0 20px 18px;font-size:16px;line-height:1.7;font-weight:700;color:#203d30">{{ survey.closes_at|date:'Y년 m월 d일 H:i' }}</td></tr>
</table>
<p style="margin:20px 0 0;font-size:14px;line-height:1.9;color:#52675b">{% if survey.anonymous %}익명으로 응답합니다. 관리자는 답변 작성자를 확인할 수 없습니다.{% else %}기명으로 응답합니다. 관리자는 개인별 답변을 확인할 수 있습니다.{% endif %}</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:28px"><tr><td align="center" bgcolor="#246b51" style="background:#246b51;border-radius:8px">
<a href="{{ url }}" style="display:inline-block;padding:14px 24px;border:1px solid #246b51;border-radius:8px;font-size:15px;line-height:1.5;font-weight:700;text-decoration:none;color:#fff">설문 응답하기</a>
</td></tr></table>
</td></tr></table>
</td></tr></table>
</body></html>
