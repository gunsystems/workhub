{% extends 'tasks/base.html' %}{% load static %}{% block content %}
<section class="heading"><div><h1>프로젝트 폴더 만들기</h1><p>작업 중인 자료를 모을 폴더와 참여자 접근 권한을 함께 준비합니다.</p></div></section>
<section class="detail"><form method="post" class="project-folder-form">{% csrf_token %}{{ form.as_p }}
<p><strong>폴더명 미리보기</strong> <output data-project-name aria-live="polite">입력하면 폴더명을 확인할 수 있습니다.</output></p>
<p>01_영업 · 02_기술 · 03_회의_이슈 · 04_산출물 폴더를 함께 만듭니다. 참여자는 편집, 경영진은 보기, 문서함 관리자는 관리 권한을 가집니다.</p>
<button class="button primary">폴더명 · 참여자 확인</button> <a class="button" href="{% url 'document_project_list' %}">목록</a></form></section>
<style>.project-folder-form{max-width:780px}.project-folder-form [hidden]{display:none}.project-folder-form p{display:grid;gap:10px;margin:0 0 22px}.project-folder-form input:not([type=checkbox]),.project-folder-form select{box-sizing:border-box;width:100%;padding:12px 14px;border:1px solid #cbded6;border-radius:10px;font:inherit}.project-folder-form #id_participants{display:grid;gap:12px;margin-bottom:24px}.project-folder-form output{overflow-wrap:anywhere;font-weight:600}.project-folder-form .errorlist{color:#a33}</style>
<script src="{% static 'tasks/document_project_form.js' %}" defer></script>{% endblock %}
