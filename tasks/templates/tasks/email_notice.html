<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f4f6f8;color:#20332d;font-family:'Malgun Gothic',Arial,sans-serif">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:32px 16px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:620px;background:#ffffff;border:1px solid #e0e7e3;border-radius:14px;overflow:hidden">
<tr><td style="padding:24px 28px;border-top:5px solid #246b51;border-bottom:1px solid #e9eeeb">
<strong style="font-size:21px;letter-spacing:0.3px;color:#205b47">GUNSYSTEMS</strong>
<div style="margin-top:5px;font-size:12px;line-height:1.5;color:#708078">Workhub · 공지사항</div>
</td></tr>
<tr><td style="padding:30px 28px 28px">
<h1 style="margin:0 0 16px;font-size:24px;line-height:1.5;font-weight:700;letter-spacing:-0.5px;color:#172f26;word-break:keep-all;overflow-wrap:anywhere">{{ notice.title }}</h1>
<p style="margin:0 0 26px;padding-bottom:20px;border-bottom:1px solid #e9eeeb;font-size:12px;line-height:1.6;color:#708078">작성자&nbsp; {{ notice.creator_name }}</p>
<div style="font-size:15px;line-height:1.9;color:#344b41;word-break:break-word;overflow-wrap:anywhere">{{ notice.body|linebreaksbr }}</div>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:32px"><tr><td align="center" bgcolor="#246b51" style="border-radius:8px;background:#246b51">
<a href="{{ notice_url }}" style="display:inline-block;padding:14px 24px;border:1px solid #246b51;border-radius:8px;font-size:14px;line-height:1.5;font-weight:700;text-decoration:none;color:#ffffff">공지사항 확인하기 →</a>
</td></tr></table>
</td></tr></table>
</td></tr></table>
</body></html>
