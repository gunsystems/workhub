<!doctype html><html lang="ko"><head>{% include 'tasks/favicon.html' %}<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회사 직원 확인 · Workhub</title><style>body{margin:0;background:#f3f5f8;color:#19283d;font:16px/1.8 system-ui,sans-serif}main{max-width:520px;margin:10vh auto;padding:36px;background:white;border-radius:18px}h1{font-size:26px}.brand{color:#236c59;font-weight:800}button{padding:12px 18px;border:0;border-radius:9px;background:#236c59;color:white;font:inherit;cursor:pointer}.actions{display:flex;gap:12px;flex-wrap:wrap}.secondary{background:#edf4f0;color:#236c59}@media(max-width:600px){main{margin:24px;padding:24px}}</style></head><body><main><p class="brand">GUNSYSTEMS · Workhub</p><h1>회사 직원 등록 확인이 필요합니다</h1><p>Workhub는 하이웍스에 등록된 회사 이메일로 인증을 마친 직원만 사용할 수 있습니다.</p><p>계정이 등록되지 않았거나 지금 하이웍스 조회를 완료하지 못해 업무 화면 접근을 보류했습니다. 잠시 후 다시 확인하거나 관리자에게 문의해 주세요.</p><div class="actions"><form method="post" action="{% url 'hiworks_access_retry' %}">{% csrf_token %}<button>등록 상태 다시 확인</button></form><form method="post" action="/logout/">{% csrf_token %}<button class="secondary">로그아웃</button></form></div></main></body></html>
